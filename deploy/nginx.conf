# ==============================================================================
# NGINX PRODUCTION REVERSE PROXY HARDENING CONFIGURATION
# Stack: Next.js (Port 3000) / Node.js
# Lokasi File di Server: /etc/nginx/sites-available/creative-hub
# ==============================================================================

# 1. Definisi Zona Rate Limiting (In-Memory Kernel Level)
limit_req_zone $binary_remote_addr zone=api_limit_ip:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit_ip:10m;

# 2. Redirect HTTP ke HTTPS secara permanen
server {
    listen 80;
    listen [::]:80;
    server_name creativehub.id www.creativehub.id;
    return 301 https://$host$request_uri;
}

# 3. Server Blok HTTPS Utama
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name creativehub.id www.creativehub.id;

    # SSL / TLS Hardening (Qualys SSL Labs Score: A+)
    ssl_certificate /etc/letsencrypt/live/creativehub.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creativehub.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 4. Anti-Information Leakage: Sembunyikan Versi Nginx & Server OS
    server_tokens off;

    # 5. Buffer Overflow & Memory Exhaustion Prevention (DoS Protection)
    client_max_body_size 12M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Timeouts ketat untuk mencegah Slowloris Attack
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    # 6. Blokir Bad Bots, Scanner, dan Tools Pentest Berdasarkan User-Agent
    if ($http_user_agent ~* (nikto|sqlmap|acunetix|nessus|masscan|zgrab|nmap|dirbuster|wpscan)) {
        return 403;
    }

    # 7. Tolak HTTP Request Method yang Tidak Didukung
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$ ) {
        return 405;
    }

    # 8. Reverse Proxy ke Next.js App
    location / {
        # Batasi koneksi simultan max 25 per IP
        limit_conn conn_limit_ip 25;

        # Rate Limiting: 15 req/s dengan toleransi burst 25 req
        limit_req zone=api_limit_ip burst=25 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Security Headers Tambahan di Level Nginx
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # 9. Blokir Akses ke File Sensitif (.git, .env, .htaccess, dll.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
